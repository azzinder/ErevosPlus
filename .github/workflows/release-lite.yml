name: release-lite

# Releases Erevos Lite (EREVOS_EDITION=lite, docs/editions.md): Erevos's own chats and calls alone,
# the Android app app.erevos.lite, versions 3.2.x (the second number says the edition: 3.0.x
# Erevos, 3.1.x Erevos+, 3.2.x Erevos Lite). Android only: two APKs from the same commit, signed
# with the release key, the one Updates installs and the F-Droid one, as release.yml makes Erevos's.
#
# Erevos Lite downloads from a repository of its own, azzinder/erevos-lite-releases (app/lib/updates.ts
# LITE_RELEASES_REPO): its releases, its latest, and channel-beta for its betas, whose version.json
# each beta replaces. Written there with the secret LITE_RELEASES_TOKEN, which may write that
# repository alone. Here only the tag v<version> is made, on the commit built: no release, so
# Erevos's own releases and their numbers (release.yml) never see Erevos Lite's.
#
# Only by hand (Actions, release-lite, Run workflow), from main, with the version named, once
# CHANGELOG.md has its "## <version>" and What's new (app/lib/whats-new.ts) its entry, so that the
# next release of Erevos Lite tells only what came after this one. As with every release, Check for
# updates installs it only once the release computer has signed it (deploy/web/publish-android.sh
# <version>, which knows 3.2.x is Erevos Lite's).
#
# Should a run stop after its release is made, Re-run failed jobs finishes it with the same build:
# the release, its betas' channel and the tag are each made only if they are not there yet. A new
# run for a version out already stops at once, so that its files never change under another build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Erevos Lite's version, 3.2.x, e.g. 3.2.0-beta.1 or 3.2.0.
        required: true

permissions: {}

# Not beside a release of Erevos: both choose a build number above every one so far.
concurrency:
  group: release
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: "1"
  EREVOS_EDITION: lite
  LITE_RELEASES_REPO: azzinder/erevos-lite-releases

jobs:
  version:
    if: github.repository == 'azzinder/Erevos'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      number: ${{ steps.number.outputs.number }}
      latest: ${{ steps.check.outputs.latest }}
      channel: ${{ steps.check.outputs.channel }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check the branch, the token and the version
        id: check
        env:
          LITE_RELEASES_TOKEN: ${{ secrets.LITE_RELEASES_TOKEN }}
          WANTED: ${{ inputs.version }}
        run: |
          # With pipefail, a list of releases that could not be read stops here, not only its last step.
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::Erevos Lite is released only from main, not from $GITHUB_REF_NAME"; exit 1
          fi
          if [ -z "$LITE_RELEASES_TOKEN" ]; then
            echo "::error::The secret LITE_RELEASES_TOKEN is missing: a token that may write $LITE_RELEASES_REPO alone (Settings → Secrets and variables → Actions)."; exit 1
          fi
          version=${WANTED#v}
          if [[ ! "$version" =~ ^([3-689]|[1-9][0-9]+)\.2\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Not a version of Erevos Lite: $version. It looks like 3.2.0, or 3.2.0-beta.1: the second number is 2."; exit 1
          fi
          # Versions, oldest first: 3.2.0~beta.1 before 3.2.0.
          order() { sed 's/-/~/' | sort -V | sed 's/~/-/'; }
          published=$(GH_TOKEN=$LITE_RELEASES_TOKEN gh api "repos/$LITE_RELEASES_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name | select(startswith("v")) | ltrimstr("v")' |
            { grep -E '^[1-9][0-9]*\.2\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' || true; } | order) || {
            echo "::error::$LITE_RELEASES_REPO could not be read with LITE_RELEASES_TOKEN"; exit 1; }
          latest=$(tail -n1 <<< "$published")
          if grep -qx -- "$version" <<< "$published"; then
            echo "::error::v$version is out already"; exit 1
          fi
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | order | tail -n1)" != "$version" ]; then
            echo "::error::$version is not newer than Erevos Lite's latest, $latest."; exit 1
          fi
          if [[ "$version" =~ -(alpha|beta)\. ]]; then
            channel=lite-beta; latest=false
          else
            channel=lite; latest=true
          fi
          # Recorded, so What's new keeps what came before it under it.
          if ! grep -q "^## $version (" CHANGELOG.md || ! grep -q "version: '$version'," app/lib/whats-new.ts; then
            echo "::error::CHANGELOG.md has no \"## $version (…)\", or app/lib/whats-new.ts no entry for it: write them first."; exit 1
          fi
          echo "Erevos Lite $version, channel $channel."
          { echo "version=$version"; echo "channel=$channel"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"

      - name: Choose the build number, above every build so far
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LITE_TOKEN: ${{ secrets.LITE_RELEASES_TOKEN }}
          # As release.yml: builds that nothing names.
          EREVOS_BUILT: "67 68"
          RELEASES_REPO: azzinder/erevos-releases
        run: |
          # Every build so far, as release.yml reads them, Erevos Lite's among them: Erevos and Erevos
          # Lite never share a number. (Erevos+, built in its own repository, reads Erevos's
          # download repository, not Erevos Lite's: its package is another, so one number in both
          # would still install.)
          builds=$(mktemp)
          if ! {
            printf '%s\n' $EREVOS_BUILT &&
            gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | select(any(.assets[]; .name == "version.json")) | .tag_name' |
              while read -r tag; do gh release download "$tag" --repo "$GH_REPO" -p version.json -O - | jq -r '.build // empty' || exit 1; done &&
            gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft) | .tag_name | select(startswith("build-")) | ltrimstr("build-")' &&
            gh api "repos/$GH_REPO/actions/workflows/erevosgram.yml/runs?per_page=100" --jq '.workflow_runs[].display_title' |
              sed -n 's/.*, build \([1-9][0-9]*\)$/\1/p' &&
            gh api "repos/$RELEASES_REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | select(any(.assets[]; .name == "version.json")) | .tag_name' |
              while read -r tag; do gh release download "$tag" --repo "$RELEASES_REPO" -p version.json -O - | jq -r '.build // empty' || exit 1; done &&
            GH_TOKEN=$LITE_TOKEN gh api "repos/$LITE_RELEASES_REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | select(any(.assets[]; .name == "version.json")) | .tag_name' |
              while read -r tag; do GH_TOKEN=$LITE_TOKEN gh release download "$tag" --repo "$LITE_RELEASES_REPO" -p version.json -O - | jq -r '.build // empty' || exit 1; done
          } > "$builds"; then
            echo "::error::Not every build so far could be read, so no number is sure for this one: no build."; exit 1
          fi
          highest=$(grep -E '^[1-9][0-9]*$' "$builds" | sort -n | tail -n1 || true)
          number=$GITHUB_RUN_NUMBER
          if [ -n "$highest" ] && [ "$number" -le "$highest" ]; then number=$((highest + 1)); fi
          echo "Build $number (the highest so far ${highest:-none})."
          echo "number=$number" >> "$GITHUB_OUTPUT"

  # As release.yml's apk job, with EREVOS_EDITION=lite: the APK is app.erevos.lite, without the
  # Phone's and the SMS's native modules or their permissions.
  apk:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: ""
            file: erevos-lite-android.apk
          - distribution: fdroid
            file: erevos-lite-android-fdroid.apk
    name: apk ${{ matrix.file }}
    env:
      EREVOS_VERSION: ${{ needs.version.outputs.version }}
      EREVOS_BUILD: ${{ needs.version.outputs.number }}
      EREVOS_DISTRIBUTION: ${{ matrix.distribution }}
      APK: ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check the release signing key is there
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::The secret $name is missing."; exit 1; }
          done

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-21
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: transports/go.mod
          cache-dependency-path: transports/go.sum

      - name: Generate the Android project
        working-directory: app
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          # Erevos Lite leaves the Phone and the SMS out (plugins/with-edition-modules.js).
          grep -q "expoAutolinking.exclude = \['erevos-phone', 'erevos-sms'\]" android/settings.gradle \
            || { echo "::error::settings.gradle does not leave out the Phone and the SMS"; cat android/settings.gradle; exit 1; }

      - name: Set up the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/release.keystore
          keytool -list -v -keystore app/android/app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' > release-fingerprint
          [ -s release-fingerprint ] || { echo "::error::The release key's fingerprint could not be read"; exit 1; }
          echo "Release key SHA-256: $(cat release-fingerprint)"

      - name: Fetch Gradle
        working-directory: app/android
        run: |
          for wait in 15 30 60 0; do ./gradlew --version --no-daemon && exit 0; [ "$wait" = 0 ] && break; echo "::warning::Gradle's download failed; again in $wait s"; sleep "$wait"; done
          exit 1

      - name: Build the release APK
        working-directory: app/android
        timeout-minutes: 50
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Check the APK
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk "$APK"
          rm -f app/android/app/release.keystore
          unzip -l "$APK" 'lib/arm64-v8a/*' | grep -q 'erevos' \
            || { echo "::error::The Erevos core is missing from the APK"; unzip -l "$APK" 'lib/*'; exit 1; }
          unzip -v "$APK" 'lib/arm64-v8a/liblyrebird.so' | grep -q 'Defl.*liblyrebird' \
            || { echo "::error::lyrebird (Tor bridges) is missing from the APK, or Android would not unpack it"; unzip -v "$APK" 'lib/*'; exit 1; }
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$APK" | tee signature
          if grep -i 'certificate SHA-1 digest' signature | tr -d ':' | grep -qi 5e8f16062ea3cd2c4a0d547876baa6f38cabf625; then
            echo "::error::The APK is signed with the debug key"; exit 1
          fi
          grep -i 'certificate SHA-256 digest' signature | tr -d ':' | tr 'A-F' 'a-f' | grep -q "$(cat release-fingerprint)" \
            || { echo "::error::The APK is not signed with the release key"; exit 1; }
          aapt2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          "$aapt2" dump badging "$APK" | tee badging | head -1
          grep -q "package: name='app.erevos.lite'" badging || { echo "::error::The APK is not app.erevos.lite"; exit 1; }
          grep -q "versionCode='$EREVOS_BUILD'" badging || { echo "::error::The APK is not build $EREVOS_BUILD"; exit 1; }
          # Erevos Lite asks for no permission of the Phone or the SMS: their modules are not in it.
          "$aapt2" dump permissions "$APK" | tee permissions
          if grep -E "SMS|MMS|WAP_PUSH|CALL_LOG|CALL_PHONE|READ_PHONE_STATE|BIND_INCALL_SERVICE|BIND_SCREENING_SERVICE|CELL_BROADCASTS" permissions; then
            echo "::error::Erevos Lite asks for a permission of the Phone or the SMS"; exit 1
          fi
          if unzip -p "$APK" 'classes*.dex' | grep -aqE 'expo/modules/(erevossms|erevosphone)/'; then
            echo "::error::The Phone's or the SMS's code is in Erevos Lite"; exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
          retention-days: 1

  publish:
    needs: [version, apk]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EREVOS_VERSION: ${{ needs.version.outputs.version }}
      EREVOS_BUILD: ${{ needs.version.outputs.number }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      LATEST: ${{ needs.version.outputs.latest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: erevos-lite-android*
          path: files
          merge-multiple: true

      - name: Make SHA256SUMS, version.json and the notes
        run: |
          set -euo pipefail
          if [ ! -f files/erevos-lite-android.apk ]; then
            echo "::error::The APK Updates installs was not made: nothing to publish"; exit 1
          fi
          (cd files && sha256sum erevos-lite-* > SHA256SUMS && cat SHA256SUMS)
          # What Updates → Check for updates reads (app/lib/updates.ts): the channel, the Android app
          # it is, and the APK's address in Erevos Lite's repository, size and SHA-256.
          APK=$(jq -n --arg url "https://github.com/$LITE_RELEASES_REPO/releases/download/v$EREVOS_VERSION/erevos-lite-android.apk" \
            --argjson size "$(stat -c %s files/erevos-lite-android.apk)" --arg sha256 "$(sha256sum files/erevos-lite-android.apk | cut -d' ' -f1)" \
            '{url: $url, size: $size, sha256: $sha256}')
          jq -n --arg name "$EREVOS_VERSION" --arg version "0.1.$EREVOS_BUILD" --argjson build "$EREVOS_BUILD" \
            --arg date "$(TZ=Europe/Athens date +%F)" --arg commit "${GITHUB_SHA::7}" --argjson apk "$APK" --arg channel "$CHANNEL" \
            '{name: $name, version: $version, build: $build, date: $date, commit: $commit, channel: $channel, package: "app.erevos.lite", apk: $apk}' > files/version.json
          cat files/version.json
          fdroid=""
          if [ -f files/erevos-lite-android-fdroid.apk ]; then
            fdroid="- **Android, the F-Droid build**: erevos-lite-android-fdroid.apk, the same Erevos Lite without Check for updates, signed with the same key."
          fi
          cat > notes.md <<NOTES
          **Erevos Lite $EREVOS_VERSION**, $(TZ=Europe/Athens date +%-d/%-m/%Y), from commit ${GITHUB_SHA::7}.

          Erevos's own private chats and calls, and nothing else: no Phone, SMS or Collection, and no permission of the Phone or the SMS.

          - **Android** 7 or newer (64-bit): in Erevos Lite, Updates → Check for updates → Install. Or open this page on the phone and tap erevos-lite-android.apk.
          $fdroid

          SHA256SUMS lists every file's SHA-256: \`sha256sum -c SHA256SUMS\`.
          Updating keeps your contacts and chats; make a backup first. To become Erevos or Erevos+: Updates, choose it there.
          NOTES
          cat notes.md

      - name: Publish to Erevos Lite's download repository
        env:
          GH_TOKEN: ${{ secrets.LITE_RELEASES_TOKEN }}
        run: |
          PRE=""
          if [ "$CHANNEL" = lite-beta ]; then PRE=--prerelease; fi
          # Run again after a failure (Re-run failed jobs, the same build), the release made then gets
          # its files again, and one left a draft by a create cut short is published now.
          if draft=$(gh release view "v$EREVOS_VERSION" --repo "$LITE_RELEASES_REPO" --json isDraft --jq .isDraft 2> /dev/null); then
            gh release upload "v$EREVOS_VERSION" files/* --repo "$LITE_RELEASES_REPO" --clobber
            if [ "$draft" = true ]; then
              gh release edit "v$EREVOS_VERSION" --repo "$LITE_RELEASES_REPO" --draft=false --latest="$LATEST" --prerelease="$([ "$CHANNEL" = lite-beta ] && echo true || echo false)"
            fi
          else
            gh release create "v$EREVOS_VERSION" files/* --repo "$LITE_RELEASES_REPO" --title "Erevos Lite $EREVOS_VERSION" --notes-file notes.md --latest="$LATEST" $PRE
          fi
          # A beta: channel-beta's version.json, which Check for updates reads for the betas, now says it.
          if [ "$CHANNEL" = lite-beta ]; then
            if ! gh release view channel-beta --repo "$LITE_RELEASES_REPO" > /dev/null 2>&1; then
              gh release create channel-beta --repo "$LITE_RELEASES_REPO" --title "Erevos Lite betas" --prerelease --latest=false \
                --notes "The newest Erevos Lite beta, for Updates → Beta versions. Its files are in the release this version.json names."
            fi
            gh release upload channel-beta files/version.json --repo "$LITE_RELEASES_REPO" --clobber
          fi
          # The five newest releases stay; channel-beta always.
          gh release list --repo "$LITE_RELEASES_REPO" --limit 100 --exclude-drafts --json tagName --jq '[.[] | select(.tagName | startswith("channel-") | not)][5:][].tagName' |
            xargs -r -n1 gh release delete --repo "$LITE_RELEASES_REPO" --cleanup-tag --yes

      # After it is out, so that a run again after a failure does not stop at a tag already made; a
      # tag there already on the commit built is left as it is.
      - name: Tag the commit built
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          there=$(gh api "repos/$GH_REPO/git/ref/tags/v$EREVOS_VERSION" --jq .object.sha 2>/dev/null || true)
          if [ "$there" = "$GITHUB_SHA" ]; then
            echo "v$EREVOS_VERSION is on $GITHUB_SHA already."
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$EREVOS_VERSION" -f sha="$GITHUB_SHA"
          fi
          echo "::notice::On the computer with the release key: deploy/web/publish-android.sh $EREVOS_VERSION <user@server>, so Check for updates installs it."
