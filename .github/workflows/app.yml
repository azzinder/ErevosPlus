name: app

# Branch pushes are checked by their pull request, so push runs only for main: half the minutes.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch stops the check still running on an older one, so only the newest
# commit is checked and the minutes go to it alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # High and critical advisories in what the app ships stop the checks (moderate ones are
      # read by hand at each dependency update).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      # The checks run the end-to-end encryption on the real core, built to WebAssembly.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-21
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: node checks/build-core.mjs
      # The two-hop checks run two real relays.
      - run: cargo build -p erevos-relay
      - run: npm run check
      - run: node scripts/build-web-core.mjs
      - run: npx expo export --platform web --output-dir dist
        env:
          EXPO_NO_TELEMETRY: "1"
      # The web app (pwa/), made and signed with a key thrown away after, then checked as a
      # server would give it out.
      - name: Make, sign and check the web app
        env:
          EREVOS_RELEASE_PASSPHRASE: only-for-this-check
        run: |
          keys=$(mktemp -d)
          node ../pwa/release.mjs keygen "$keys/release.key" "$keys/release.pub"
          node ../pwa/build.mjs dist web-app --key "$keys/release.pub" --version 1
          node ../pwa/release.mjs sign web-app "$keys/release.key" --android 1 "$(printf '%064d' 0)"
          node ../pwa/release.mjs verify web-app "$keys/release.pub"
