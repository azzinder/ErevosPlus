name: release

# Builds every Erevos package and publishes them together as a GitHub release, v<version>:
# the Android APK (signed with the release key, see scripts/make-release-keystore.sh), Linux
# (Arch package and AppImage), the macOS disk image, Windows (installer and portable .exe), the
# Sailfish OS RPM and the web app (to be signed on the release computer, deploy/web/publish.sh).
# Each release lists every file's SHA-256 in SHA256SUMS. A package whose job fails is left out;
# the others still go out.
#
# When: every night, if main changed since the last release, and whenever started by hand
# (Actions, release, Run workflow). Not on every push: a full build takes over an hour of
# Actions minutes, and main moves many times a day.
#
# The version: the one named when started by hand (Run workflow, version), else the one after the
# latest release, 2.0.1 after 2.0.0. Releases until 0.1.16 were 0.1.<run number>; the one after them
# is 2.0.0. A test release before a version is named as in 4.0.0-rc.1 (a release candidate; also
# -alpha.<n> and -beta.<n>): it comes after 3.x and before 4.0.0, the one after it is 4.0.0-rc.2
# (app/lib/version-name.ts reads the same names). A release candidate goes out as the latest
# release like any other. A beta or an alpha (7.0.1-beta.1) is a prerelease, never the latest: it
# goes to Erevos's beta channel (app/lib/update-channel.ts), a release tagged channel-erevos-beta
# whose version.json each beta replaces, and only an Erevos that joined the betas (Updates, Beta
# versions) is offered it. Erevos+'s releases (7.1.x, from the erevos-plus branch) are in the same
# repositories, titled "Erevos+ …"; they count for nothing in the version.
#
# Every build has its own number, which Android and Check for updates go by: the run's, unless an
# Erevos+ build already took it or one above it. Erevos+'s 7.x were the same app to Android as
# Erevos (app.erevos); since 3.1.0 it is app.erevos.plus. They still share one row of build
# numbers, and a build's is always above every one before it (the version job, Choose the build number).
#
# The jobs hand their files to the publish job through a draft release, build-<build number>:
# artifacts would fill the account's Actions storage, release files do not count toward it.
# The five newest releases stay.
#
# From main, or from a series' own branch, release/<major>.x (release/6.x: fixes of the 6 series
# while main moves on to 7): from there the version must be of that series and newer than the
# series' own last release, started by hand. A release goes out as GitHub's latest only when no
# published release has a newer version, so a fix of an older series never hides a newer one.

on:
  schedule:
    # 02:30 UTC, after the day's work.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: The release's version, e.g. 2.1.0, or 4.0.0-rc.1 for a test release before 4.0.0. Empty for the one after the latest (2.0.0 → 2.0.1, 4.0.0-rc.1 → 4.0.0-rc.2).
        required: false
        default: ''
      macos:
        description: off leaves macOS out of this release only (release-macos.yml can add it later); empty follows the repository variable EREVOS_MACOS.
        required: false
        default: ''

# Each job asks for what it needs: contents: write where it uses gh release.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# Each job also has EREVOS_VERSION and EREVOS_BUILD, from the version job.
# This workflow releases the plain Erevos (docs/editions.md): Erevos's own chats, the Phone, the SMS
# and the Collection, its core without Matrix, XMPP and chats with other Nostr apps. Erevos+ is
# built by erevosgram.yml.
env:
  EXPO_NO_TELEMETRY: "1"
  EREVOS_EDITION: lite

jobs:
  # Decides whether to build at all and the build's number, then opens the draft release the jobs
  # hand their files to. Only in Erevos's own repository: in ErevosPlus (Erevos+), whose releases
  # erevosgram.yml makes, this file comes with each merge of Erevos's main and does nothing.
  version:
    if: github.repository == 'azzinder/Erevos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Erevos+'s builds under way (erevosgram.yml's runs), for the build number.
      actions: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      number: ${{ steps.number.outputs.number }}
      version: ${{ steps.check.outputs.version }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - name: Choose the build number, above every Erevos and Erevos+ build so far
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Builds that nothing below names: Erevos+ 7.1.0-beta.5 (67), whose run named no build; and 68,
          # kept for Erevos+'s next build (beta.5 with Messenger's start fixed) before its run names it;
          EREVOS_BUILT: "67 68"
          RELEASES_REPO: azzinder/erevos-releases
        run: |
          # Every build so far: each published release's, Erevos's and Erevos+'s (its version.json),
          # the builds under way here (their drafts, build-<n>), and Erevos+'s and ErevosGram's
          # (erevosgram.yml, whose runs are named "<version>, build <n>", the unpublished ones too, until
          # Erevos+ moved to azzinder/ErevosPlus), and every release in the public download repository,
          # where Erevos+'s releases are published from there.
          # Should any of them not be read, no build: two with one number would not install.
          builds=$(mktemp)
          if ! {
            printf '%s\n' $EREVOS_BUILT &&
            gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | select(any(.assets[]; .name == "version.json")) | .tag_name' |
              while read -r tag; do gh release download "$tag" --repo "$GH_REPO" -p version.json -O - | jq -r '.build // empty' || exit 1; done &&
            gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft) | .tag_name | select(startswith("build-")) | ltrimstr("build-")' &&
            gh api "repos/$GH_REPO/actions/workflows/erevosgram.yml/runs?per_page=100" --jq '.workflow_runs[].display_title' |
              sed -n 's/.*, build \([1-9][0-9]*\)$/\1/p' &&
            gh api "repos/$RELEASES_REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | select(any(.assets[]; .name == "version.json")) | .tag_name' |
              while read -r tag; do gh release download "$tag" --repo "$RELEASES_REPO" -p version.json -O - | jq -r '.build // empty' || exit 1; done
          } > "$builds"; then
            echo "::error::Not every build so far could be read, so no number is sure for this one: no build."; exit 1
          fi
          highest=$(grep -E '^[1-9][0-9]*$' "$builds" | sort -n | tail -n1 || true)
          number=$GITHUB_RUN_NUMBER
          if [ -n "$highest" ] && [ "$number" -le "$highest" ]; then number=$((highest + 1)); fi
          echo "Build $number (the run's number is $GITHUB_RUN_NUMBER; the highest build so far ${highest:-none})."
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check the branch, whether main changed since the last release, and the version
        id: check
        env:
          EREVOS_BUILD: ${{ steps.number.outputs.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WANTED: ${{ inputs.version }}
        run: |
          series=""
          if [[ "$GITHUB_REF_NAME" =~ ^release/([1-9][0-9]*)\.x$ ]]; then
            series=${BASH_REMATCH[1]}
          elif [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::Releases are built only from main or a release/<major>.x branch, not from $GITHUB_REF_NAME"; exit 1
          fi
          # Versions, oldest first. Sorted with "-" as "~", which sort -V puts before the end:
          # 4.0.0~rc.1 before 4.0.0. And 3.x to 6.x after 7.x, before 8.x: since 7.x the second
          # number says the edition (3.0.x Erevos, 3.1.x Erevos+, 3.2.x Erevos⁻), and the numbers
          # start again at 3; they skip 7 itself (6.x, then 8.0.0). No release before 7.x is
          # published. app/lib/version-name.ts orders them the same way.
          order() {
            local v major rank
            while read -r v; do
              [ -n "$v" ] || continue
              major=$((10#${v%%.*}))
              if [ "$major" -ge 3 ] && [ "$major" -le 6 ]; then rank=$((70 + major - 2)); else rank=$((major * 10)); fi
              printf '%s %s\n' "$rank" "${v//-/\~}"
            done | sort -k1,1n -k2,2V | cut -d' ' -f2 | tr '~' '-'
          }
          # Every published release's version, oldest first.
          published=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | select(.name | startswith("Erevos+") | not) | .tag_name | ltrimstr("v")' 2>/dev/null |
            grep -E '^[1-9][0-9]*\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' | order || true)
          if [ -n "$series" ]; then
            # A series' branch: its own last release, whatever main released since.
            latest=$(grep -E "^$series\." <<< "$published" | tail -n1 || true)
            last=""
          else
            # The newest plain Erevos release that is not a beta or an alpha, not GitHub's latest,
            # which can be an Erevos+ one.
            latest=$(grep -vE -- '-(alpha|beta)\.' <<< "$published" | tail -n1 || true)
            last=""
            if [ -n "$latest" ]; then
              last=$(gh api "repos/$GH_REPO/releases/tags/v$latest" --jq '.target_commitish' 2>/dev/null || true)
            fi
          fi
          if [ -n "$WANTED" ]; then
            version=${WANTED#v}
          elif [[ "$latest" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            # The last number goes up: of the test part when there is one (4.0.0-rc.1 → 4.0.0-rc.2).
            version="${latest%.*}.$((10#${latest##*.} + 1))"
          else
            version=2.0.0
          fi
          if [[ ! "$version" =~ ^[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Not a version: $version. It looks like 2.1.0, or 4.0.0-rc.1 for a test release before 4.0.0."; exit 1
          fi
          if [ -n "$series" ] && [ "${version%%.*}" != "$series" ]; then
            echo "::error::$GITHUB_REF_NAME releases only $series.x versions, not $version: name the version when starting it."; exit 1
          fi
          newest=$(printf '%s\n%s\n' "$latest" "$version" | order | tail -n1)
          if [ "$version" = "$latest" ] || [ "$newest" != "$version" ]; then
            echo "::error::$version is not newer than the latest release, $latest."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # GitHub's latest only when no published release is newer (a fix of an older series is not).
          top=$(printf '%s\n%s\n' "$published" "$version" | order | tail -n1)
          # A beta or an alpha never is: only those who joined the betas take it.
          if [[ "$version" =~ -(alpha|beta)\. ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
            top="(a beta is never the latest)"
          elif [ "$top" = "$version" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
          echo "GitHub's latest release after it: $([ "$top" = "$version" ] && echo this one || echo "still $top")."
          echo "This release: $version (build $EREVOS_BUILD; the latest is ${latest:-none})."
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "main has not changed since the last release (${GITHUB_SHA::7}): nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the draft release the jobs hand their files to
        if: ${{ steps.check.outputs.build == 'true' }}
        env:
          EREVOS_BUILD: ${{ steps.number.outputs.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Drafts of builds that never published (older than six hours). A cleanup that fails
          # does not hold the build back.
          gh release list --limit 100 --json tagName,isDraft,createdAt \
            --jq '.[] | select(.isDraft and (.tagName | startswith("build-")) and ((.createdAt | fromdateiso8601) < (now - 21600))) | .tagName' |
            xargs -r -n1 gh release delete --yes || echo "::warning::Old build drafts not deleted"
          gh release create "build-$EREVOS_BUILD" --draft --target "$GITHUB_SHA" --title "Build $EREVOS_BUILD (in progress)" --notes ""

  # The Android APK for 64-bit ARM phones (every phone of the last years), signed with the
  # release key. Without the key's four secrets the job stops and the release goes out without
  # an APK, rather than sign with the public debug key, which would let anyone's APK install
  # over Erevos.
  # Two APKs from the same commit, both signed with the release key: the one Updates installs, and
  # the F-Droid one (EREVOS_DISTRIBUTION=fdroid: no Check for updates, no permission to install
  # packages), which F-Droid builds again from the tag and compares with this one, to hand out
  # this signed copy (a reproducible build). One key for both, and for Erevos+, so each installs
  # over the other.
  apk:
    needs: version
    if: ${{ needs.version.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: ""
            file: erevos-android.apk
          - distribution: fdroid
            file: erevos-android-fdroid.apk
    name: apk ${{ matrix.file }}
    env:
      EREVOS_VERSION: ${{ needs.version.outputs.version }}
      EREVOS_BUILD: ${{ needs.version.outputs.number }}
      EREVOS_DISTRIBUTION: ${{ matrix.distribution }}
      APK: ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check the release signing key is there
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::The secret $name is missing. Make the release key with scripts/make-release-keystore.sh and add the four secrets it names under Settings → Secrets and variables → Actions."; exit 1; }
          done

      # The Rust core, Tor and the native modules need more disk than the runner leaves free.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-21
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      # Go builds lyrebird, Tor's pluggable transports for bridges (transports/go.mod).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: transports/go.mod
          cache-dependency-path: transports/go.sum

      - name: Generate the Android project
        working-directory: app
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Set up the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/release.keystore
          # The alias and password open it (a wrong one fails here, clearly, not inside Gradle);
          # its fingerprint is what the APK must be signed with.
          keytool -list -v -keystore app/android/app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' > release-fingerprint
          [ -s release-fingerprint ] || { echo "::error::The release key's fingerprint could not be read"; exit 1; }
          echo "Release key SHA-256: $(cat release-fingerprint)"

      # Gradle's own download fails now and then (7.0.0-rc.5: HTTP 504, and the release went out
      # without its APK): fetched first, tried four times.
      - name: Fetch Gradle
        working-directory: app/android
        run: |
          for wait in 15 30 60 0; do ./gradlew --version --no-daemon && exit 0; [ "$wait" = 0 ] && break; echo "::warning::Gradle's download failed; again in $wait s"; sleep "$wait"; done
          exit 1

      - name: Build the release APK
        working-directory: app/android
        # It takes about 25 minutes. On 7.2.0-beta.2 the F-Droid build hung in packageRelease for
        # 1 h 45 min with no error; stop it sooner so the release still comes out without it.
        timeout-minutes: 50
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Check the APK
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk "$APK"
          rm -f app/android/app/release.keystore
          # It carries the Rust core.
          unzip -l "$APK" 'lib/arm64-v8a/*' | grep -q 'erevos' \
            || { echo "::error::The Erevos core is missing from the APK"; unzip -l "$APK" 'lib/*'; exit 1; }
          # And lyrebird for Tor bridges, compressed, so Android unpacks it to where it may run
          # (plugins/with-native-programs.js).
          unzip -v "$APK" 'lib/arm64-v8a/liblyrebird.so' | grep -q 'Defl.*liblyrebird' \
            || { echo "::error::lyrebird (Tor bridges) is missing from the APK, or Android would not unpack it"; unzip -v "$APK" 'lib/*'; exit 1; }
          # Signed by the release key, never by the public debug key (SHA-1 5E:8F:16:06:2E:A3:…).
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$APK" | tee signature
          if grep -i 'certificate SHA-1 digest' signature | tr -d ':' | grep -qi 5e8f16062ea3cd2c4a0d547876baa6f38cabf625; then
            echo "::error::The APK is signed with the debug key"; exit 1
          fi
          grep -i 'certificate SHA-256 digest' signature | tr -d ':' | tr 'A-F' 'a-f' | grep -q "$(cat release-fingerprint)" \
            || { echo "::error::The APK is not signed with the release key"; exit 1; }
          # The F-Droid build may not install packages: F-Droid updates it.
          if [ "$EREVOS_DISTRIBUTION" = fdroid ]; then
            aapt2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
            if "$aapt2" dump permissions "$APK" | grep -q REQUEST_INSTALL_PACKAGES; then
              echo "::error::The F-Droid APK asks to install packages"; exit 1
            fi
          fi

      - name: Hand the APK to the publish job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "build-$EREVOS_BUILD" "$APK" --clobber

  # Linux, and the web build with its core that the macOS and Windows jobs package too.
  linux:
    needs: version
    if: ${{ needs.version.outputs.build == 'true' }}
    env:
      EREVOS_VERSION: ${{ needs.version.outputs.version }}
      EREVOS_BUILD: ${{ needs.version.outputs.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-21
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build the web app with its core
        working-directory: app
        env:
          EXPO_PUBLIC_SHELL: electron
        run: |
          npm ci
          node scripts/build-web-core.mjs
          npx expo export --clear --platform web --output-dir ../desktop/web
          test -f ../desktop/web/core/erevos_ffi_bg.wasm
          # Element Call, for Matrix calls, served apart at app://element-call (desktop/main.js):
          # Erevos+ only, as the plain Erevos has no Matrix.
          if [ "$EREVOS_EDITION" != lite ]; then node ../pwa/element-call.mjs node_modules/@element-hq/element-call-embedded/dist ../desktop/web/element-call; fi

      # Handed over before the Linux packages, so a failure there does not hold the Mac and Windows back.
      - name: Hand the desktop web build to the macOS and Windows jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tar -czf desktop-web.tar.gz -C desktop web
          gh release upload "build-$EREVOS_BUILD" desktop-web.tar.gz --clobber

      # The web app (pwa/), from the same commit and with the same number, but not signed: its
      # release key stays on the release computer, which signs and serves it with
      # deploy/web/publish.sh. Also before the Linux packages, for the same reason.
      - name: Build the web app for browsers
        working-directory: app
        run: |
          npx expo export --clear --platform web --output-dir ../web-build
          cd ..
          # Element Call only in Erevos+: the plain Erevos has no Matrix.
          node pwa/build.mjs web-build erevos-web --label "$EREVOS_VERSION" $([ "$EREVOS_EDITION" = lite ] && echo --no-element-call)
          tar -czf erevos-web.tar.gz -C erevos-web .
      - name: Hand the web app to the publish job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "build-$EREVOS_BUILD" erevos-web.tar.gz --clobber

      - run: npm ci
        working-directory: desktop
      - name: Start it and wait for its first screen
        working-directory: desktop
        run: xvfb-run -a npx electron . --smoke --no-sandbox --plain-secrets
      # Ubuntu's mirror cannot always be reached from the runner (7.0.0-rc.9 went out without Linux
      # for it): tried four times.
      - name: Install what the pacman package needs
        run: |
          for wait in 15 30 60 0; do
            sudo apt-get update -q && sudo apt-get install -y -q libarchive-tools && exit 0
            [ "$wait" = 0 ] && break; echo "::warning::apt-get failed; again in $wait s"; sleep "$wait"
          done
          exit 1
      - name: Build the Arch Linux package and AppImage
        working-directory: desktop
        run: |
          # Since 7.x the numbers start again at 3 (the version job): pacman takes every major from
          # 3 on, but 7, as newer by its epoch, 1 (1:3.0.0 after 7.2.0).
          if [ "${EREVOS_VERSION%%.*}" -ge 3 ] && [ "${EREVOS_VERSION%%.*}" != 7 ]; then
            node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.build.pacman = { ...p.build.pacman, fpm: ["--epoch", "1"] }; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")'
          fi
          npx electron-builder --linux pacman AppImage --x64 --publish never -c.extraMetadata.version=$EREVOS_VERSION
      - name: Hand the packages to the publish job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir up
          cp desktop/dist/*.pacman up/erevos-linux-x86_64.pacman
          cp desktop/dist/*.AppImage up/erevos-linux-x86_64.AppImage
          gh release upload "build-$EREVOS_BUILD" up/* --clobber

  # One app for Apple silicon and Intel (macOS 13 or newer), signed ad hoc, not by Apple (that
  # needs a paid Apple Developer ID). A Mac minute counts as ten, so none while the repository
  # variable EREVOS_MACOS is "off", or while a dispatch says macos: off; release-macos.yml adds it
  # to such a release later.
  macos:
    needs: [version, linux]
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && vars.EREVOS_MACOS != 'off' && inputs.macos != 'off' }}
    env:
      EREVOS_VERSION: ${{ needs.version.outputs.version }}
      EREVOS_BUILD: ${{ needs.version.outputs.number }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Take the desktop web build from the Linux job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "build-$EREVOS_BUILD" -p desktop-web.tar.gz
          tar -xzf desktop-web.tar.gz -C desktop
          test -f desktop/web/core/erevos_ffi_bg.wasm
      - run: npm ci
        working-directory: desktop
      - name: Build the macOS disk image
        working-directory: desktop
        run: npx electron-builder --mac dmg --universal --publish never -c.extraMetadata.version=$EREVOS_VERSION
      - name: Open the disk image and start the app
        run: |
          set -euo pipefail
          dmg=$(ls desktop/dist/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -noautoopen -mountpoint "$mnt"
          app="$mnt/Erevos.app"
          archs=$(lipo -archs "$app/Contents/MacOS/Erevos")
          echo "Architectures: $archs"
          case " $archs " in *" arm64 "*) ;; *) echo "::error::No Apple silicon code"; exit 1 ;; esac
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::No Intel code"; exit 1 ;; esac
          codesign --verify --deep --strict --verbose=2 "$app"
          keychain="$RUNNER_TEMP/erevos-check.keychain-db"
          security create-keychain -p erevos-check "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p erevos-check "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          "$app/Contents/MacOS/Erevos" --smoke | tee smoke.log
          grep -q "SMOKE OK core=true secrets=encrypted" smoke.log
          hdiutil detach "$mnt"
      - name: Hand the disk image to the publish job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir up
          cp desktop/dist/*.dmg up/erevos-macos.dmg
          gh release upload "build-$EREVOS_BUILD" up/erevos-macos.dmg --clobber

  # Windows 10 and 11 (x64): an installer, which installs for this user without asking for an
  # administrator, and a portable .exe that runs without installing. Neither is signed: that needs a
  # code signing certificate, which costs money every year, so Windows' SmartScreen warns before
  # the first start. A Windows minute counts as two, so none while the repository variable
  # EREVOS_WINDOWS is "off".
  windows:
    needs: [version, linux]
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && vars.EREVOS_WINDOWS != 'off' }}
    env:
      EREVOS_VERSION: ${{ needs.version.outputs.version }}
      EREVOS_BUILD: ${{ needs.version.outputs.number }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Take the desktop web build from the Linux job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "build-$EREVOS_BUILD" -p desktop-web.tar.gz
          tar -xzf desktop-web.tar.gz -C desktop
          test -f desktop/web/core/erevos_ffi_bg.wasm
      - run: npm ci
        working-directory: desktop
      - name: Build the installer and the portable app
        working-directory: desktop
        run: npx electron-builder --win nsis portable --x64 --publish never -c.extraMetadata.version=$EREVOS_VERSION
      # The app both of them hold, as it is before it is packed.
      - name: Start the app and wait for its first screen
        run: |
          set -euo pipefail
          desktop/dist/win-unpacked/Erevos.exe --smoke | tee smoke.log
          grep -q "SMOKE OK core=true secrets=encrypted" smoke.log
      - name: Hand the installer and the portable app to the publish job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir up
          cp desktop/dist/erevos-windows-x64-setup.exe desktop/dist/erevos-windows-x64-portable.exe up/
          gh release upload "build-$EREVOS_BUILD" up/* --clobber

  sailfish:
    needs: version
    if: ${{ needs.version.outputs.build == 'true' }}
    env:
      EREVOS_VERSION: ${{ needs.version.outputs.version }}
      EREVOS_BUILD: ${{ needs.version.outputs.number }}
    # ubuntu-26.04 (ubuntu-latest since 11-2026) runs Docker where the Sailfish SDK's sb2d cannot
    # create its server socket: the SDK builds on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-21
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build the web app with its core, and the icons
        run: sailfish/build-web.sh
      - name: Build the RPM for aarch64
        working-directory: sailfish
        run: |
          # An RPM version has no "-": a test release's is 4.0.0~rc.1, which RPM puts before 4.0.0.
          sed -i "s/^Version:.*/Version:    ${EREVOS_VERSION//-/\~}/" rpm/erevos.spec
          # Since 7.x the numbers start again at 3 (the version job): RPM takes every major from 3
          # on, but 7, as newer by its epoch, 1 (1:3.0.0 after 7.2.0, which has none).
          if [ "${EREVOS_VERSION%%.*}" -ge 3 ] && [ "${EREVOS_VERSION%%.*}" != 7 ]; then sed -i 's/^Version:.*/&\nEpoch:      1/' rpm/erevos.spec; fi
          # The SDK image builds as its own user.
          chmod -R a+rwX .
          ./build-rpm.sh
          ls RPMS/*.aarch64.rpm
      - name: Hand the RPM to the publish job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir up
          for f in sailfish/RPMS/*.aarch64.rpm; do
            case "$f" in *debug*) ;; *) cp "$f" up/erevos-sailfish-aarch64.rpm ;; esac
          done
          gh release upload "build-$EREVOS_BUILD" up/* --clobber

  publish:
    needs: [version, apk, linux, macos, windows, sailfish]
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EREVOS_VERSION: ${{ needs.version.outputs.version }}
      EREVOS_BUILD: ${{ needs.version.outputs.number }}
      # true unless a published release has a newer version (see the top of this file).
      EREVOS_LATEST: ${{ needs.version.outputs.latest }}
      # Writes to the public download repository that Updates → Check for updates reads
      # (app/lib/updates.ts); without the token that step is skipped.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      RELEASES_REPO: azzinder/erevos-releases
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # What the jobs that succeeded handed over (not the web build the macOS job took).
          gh release download "build-$EREVOS_BUILD" -D files -p 'erevos-*' || true
          if ! ls files/erevos-* > /dev/null 2>&1; then
            echo "::error::No job made a package: nothing to publish"; exit 1
          fi
          (cd files && sha256sum erevos-* > SHA256SUMS && cat SHA256SUMS)
          # What Updates → Check for updates reads to find a new version (app/lib/updates.ts): its
          # name and build number, the APK's address in the public repository, its size and
          # SHA-256, which the app checks. `version` is for Erevos 0.1.16 and before, which read
          # only 0.1.<build>: they offer this release under that number.
          APK=null
          if [ -f files/erevos-android.apk ]; then
            APK=$(jq -n --arg url "https://github.com/$RELEASES_REPO/releases/download/v$EREVOS_VERSION/erevos-android.apk" \
              --argjson size "$(stat -c %s files/erevos-android.apk)" --arg sha256 "$(sha256sum files/erevos-android.apk | cut -d' ' -f1)" \
              '{url: $url, size: $size, sha256: $sha256}')
          fi
          # Its channel (app/lib/update-channel.ts): a beta or an alpha is in Erevos's beta channel. And
          # its Android app, app.erevos: another edition's is a move, not an update (lib/edition-move.ts).
          if [[ "$EREVOS_VERSION" =~ -(alpha|beta)\. ]]; then CHANNEL=erevos-beta; else CHANNEL=erevos; fi
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          jq -n --arg name "$EREVOS_VERSION" --arg version "0.1.$EREVOS_BUILD" --argjson build "$EREVOS_BUILD" \
            --arg date "$(TZ=Europe/Athens date +%F)" --arg commit "${GITHUB_SHA::7}" --argjson apk "$APK" --arg channel "$CHANNEL" \
            '{name: $name, version: $version, build: $build, date: $date, commit: $commit, channel: $channel, package: "app.erevos", apk: $apk}' > files/version.json
          cat files/version.json
          : > packages.md
          package() { if [ -f "files/$1" ]; then echo "- $2" >> packages.md; fi; }
          package erevos-android.apk "**Android** 7 or newer (64-bit): in Erevos, Updates → Check for updates → Install. Or open this page on the phone and tap erevos-android.apk."
          package erevos-android-fdroid.apk "**Android, the F-Droid build**: erevos-android-fdroid.apk, the same Erevos without Check for updates, signed with the same key. F-Droid builds it again from this release's source and hands out this signed copy when the two match."
          package erevos-linux-x86_64.pacman "**Arch Linux / CachyOS** (x86_64): \`sudo pacman -U erevos-linux-x86_64.pacman\`"
          package erevos-linux-x86_64.AppImage "**Other Linux** (x86_64): make erevos-linux-x86_64.AppImage executable and run it (needs FUSE 2)."
          package erevos-macos.dmg "**macOS** 13 or newer (Apple silicon and Intel): open erevos-macos.dmg and drag Erevos to Applications. It has no paid Apple signature: the first time, and after each update, allow it under System Settings → Privacy & Security → Open Anyway."
          package erevos-windows-x64-setup.exe "**Windows** 10 or 11 (x64): run erevos-windows-x64-setup.exe, or erevos-windows-x64-portable.exe to use Erevos without installing it. It has no paid signature: the first time, Windows says it protected your PC; tap More info, then Run anyway."
          package erevos-sailfish-aarch64.rpm "**Sailfish OS** 5 (aarch64): install erevos-sailfish-aarch64.rpm."
          package erevos-web.tar.gz "**Web app** (iPhone and any browser): erevos-web.tar.gz is not signed yet. It is served once signed on the release computer: \`deploy/web/publish.sh $EREVOS_VERSION <user@server> <address>\`."
          missing=""
          [ -f files/erevos-android.apk ] || missing="$missing Android,"
          [ -f files/erevos-macos.dmg ] || missing="$missing macOS,"
          [ -f files/erevos-linux-x86_64.AppImage ] || missing="$missing Linux,"
          [ -f files/erevos-windows-x64-setup.exe ] || missing="$missing Windows,"
          [ -f files/erevos-sailfish-aarch64.rpm ] || missing="$missing Sailfish OS,"
          [ -f files/erevos-web.tar.gz ] || missing="$missing web app,"
          cat > notes.md <<NOTES
          **Erevos $EREVOS_VERSION**, $(TZ=Europe/Athens date +%-d/%-m/%Y), from commit ${GITHUB_SHA::7}.

          $(cat packages.md)

          ${missing:+Not in this release:${missing%,} (its build failed or is switched off; the release before may have it).}

          SHA256SUMS lists every file's SHA-256: \`sha256sum -c SHA256SUMS\`. Once the web app of this release is published, its release key signs the list too (SHA256SUMS.sig beside the web app, signed again whenever a package is added later): \`node pwa/release.mjs verify-sums SHA256SUMS https://<web app address>\` checks it first.
          Updating keeps your contacts and chats; make a backup first. In Erevos: Updates → Check for updates; by hand: User guide → Updates.
          NOTES
          cat notes.md
          PRE=""
          if [ "$CHANNEL" = erevos-beta ]; then PRE=--prerelease; fi
          echo "PRE=$PRE" >> "$GITHUB_ENV"
          gh release create "v$EREVOS_VERSION" files/* --target "$GITHUB_SHA" --title "Erevos $EREVOS_VERSION" --notes-file notes.md --latest="$EREVOS_LATEST" $PRE
          gh release delete "build-$EREVOS_BUILD" --yes
          # Erevos's five newest releases stay. Erevos+'s (titled "Erevos+ …") and the channels' are
          # not Erevos's to remove: a channel's version.json names an Erevos+ release that must stay.
          gh release list --limit 100 --exclude-drafts --json tagName,name --jq '[.[] | select((.tagName | startswith("channel-")) or ((.name // "") | startswith("Erevos+")) | not)][5:][].tagName' |
            xargs -r -n1 gh release delete --cleanup-tag --yes

      # The public repository holds only the releases: Erevos's own repository stays private.
      - name: Publish to the public download repository
        if: ${{ env.RELEASES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "v$EREVOS_VERSION" files/* --repo "$RELEASES_REPO" --title "Erevos $EREVOS_VERSION" --notes-file notes.md --latest="$EREVOS_LATEST" $PRE
          # A beta: its channel's release, whose version.json Check for updates reads, now says it.
          if [ "$CHANNEL" != erevos ]; then
            if ! gh release view "channel-$CHANNEL" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
              gh release create "channel-$CHANNEL" --repo "$RELEASES_REPO" --title "Erevos betas" --prerelease --latest=false \
                --notes "The newest Erevos beta, for Updates → Beta versions. Its files are in the release this version.json names."
            fi
            gh release upload "channel-$CHANNEL" files/version.json --repo "$RELEASES_REPO" --clobber
          fi
          gh release list --repo "$RELEASES_REPO" --limit 100 --exclude-drafts --json tagName,name --jq '[.[] | select((.tagName | startswith("channel-")) or ((.name // "") | startswith("Erevos+")) | not)][5:][].tagName' |
            xargs -r -n1 gh release delete --repo "$RELEASES_REPO" --cleanup-tag --yes
