name: android

# Builds the Android app the way the build computer does (expo prebuild, then Gradle), so a
# native library that does not compile shows here before anyone builds it by hand. One ABI only,
# the emulator's, to keep it quick. Main itself is built every night by release.yml.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The Rust core, Tor, lyrebird and the native modules need more disk than the runner leaves
      # free, as in release.yml.
      - name: Free disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-21
        with:
          toolchain: stable
          targets: x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      # Go builds lyrebird, Tor's pluggable transports for bridges (transports/go.mod).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: transports/go.mod
          cache-dependency-path: transports/go.sum
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # As in the releases: Gradle's own download, and the plugins it fetches before it builds anything,
      # fail now and then, so they are fetched first, tried four times, a plugin not found asked for
      # again after the first; Maven Central's files come from Google's copy of it, here and in the
      # build after (scripts/maven-central-mirror.gradle).
      - name: Fetch Gradle and its plugins
        working-directory: app/android
        run: |
          install -D -m 644 "$GITHUB_WORKSPACE/scripts/maven-central-mirror.gradle" ~/.gradle/init.d/maven-central-mirror.gradle
          refresh=""
          for wait in 15 30 60 0; do
            ./gradlew --version --no-daemon && ./gradlew help --no-daemon $refresh -PreactNativeArchitectures=x86_64 && exit 0
            [ "$wait" = 0 ] && break
            echo "::warning::Gradle, or a plugin it needs, could not be fetched; again in $wait s"
            sleep "$wait"
            refresh=--refresh-dependencies
          done
          exit 1

      - name: Gradle
        working-directory: app/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
