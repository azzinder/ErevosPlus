apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.erevoscore'
version = '0.0.1'

// The core is Rust, in crates/erevos-ffi at the top of the repository. Before this module builds,
// cargo-ndk builds the core for each Android ABI the app is built for, so the app always carries
// the core of its own checkout. Rust's Android targets and cargo-ndk are needed once (README.md).
def repoRoot = file('../../../..')
def rustLibs = layout.buildDirectory.dir('rustJniLibs').get().asFile
def allAbis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
def abis = (findProperty('reactNativeArchitectures') ?: allAbis.join(','))
  .split(',').collect { it.trim() }.findAll { it }
// Gradle can start without the shell's PATH, so look where rustup puts cargo first.
def cargoHome = System.getenv('CARGO_HOME') ?: "${System.getProperty('user.home')}/.cargo"
def cargo = new File(cargoHome, 'bin/cargo').canExecute() ? "${cargoHome}/bin/cargo" : 'cargo'

// Tor bridges hide Tor with a pluggable transport: lyrebird, Tor's own (obfs4, Snowflake,
// WebTunnel, meek), in Go, pinned in transports/go.mod at the top of the repository. It is a
// program that Tor starts, and Android runs programs only from where it unpacks the native
// libraries, so it is built for each ABI with the NDK's compiler and carried as liblyrebird.so
// (plugins/with-native-programs.js has Android unpack it). It goes through the NDK, not plain
// Go, so that it looks names up the phone's own way. Go is needed once (README.md).
def ptLibs = layout.buildDirectory.dir('ptJniLibs').get().asFile
def goAbis = [
  'arm64-v8a': [arch: 'arm64', clang: 'aarch64-linux-android'],
  'armeabi-v7a': [arch: 'arm', clang: 'armv7a-linux-androideabi'],
  'x86': [arch: '386', clang: 'i686-linux-android'],
  'x86_64': [arch: 'amd64', clang: 'x86_64-linux-android'],
]
def goRoot = System.getenv('GOROOT')
def go = goRoot && new File(goRoot, 'bin/go').canExecute() ? "${goRoot}/bin/go" : 'go'
def lyrebird = 'gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird/cmd/lyrebird'
def lyrebirdVersion = '0.9.0'

android {
  namespace 'expo.modules.erevoscore'
  if (rootProject.hasProperty('ndkVersion')) {
    ndkVersion rootProject.ext.ndkVersion
  }

  defaultConfig {
    versionCode 1
    versionName '0.0.1'
  }

  sourceSets {
    main.jniLibs.srcDirs += [rustLibs, ptLibs]
  }
}

def buildRustCore = tasks.register('buildRustCore', Exec) {
  description = 'Builds the Erevos core (crates/erevos-ffi) for the Android ABIs of this build.'
  workingDir repoRoot
  // Every crate the Android core is built from, so a change in any of them builds it again.
  def crates = ['erevos-core', 'erevos-ffi', 'erevos-group', 'erevos-import', 'erevos-tor', 'erevos-matrix', 'erevos-xmpp', 'erevos-nostr', 'erevos-speech']
  inputs.files(
    crates.collect { fileTree(new File(repoRoot, "crates/${it}/src")) },
    crates.collect { new File(repoRoot, "crates/${it}/Cargo.toml") },
    new File(repoRoot, 'Cargo.toml'),
    new File(repoRoot, 'Cargo.lock'),
  )
  inputs.property('abis', abis)
  outputs.dir(rustLibs)

  def command = [cargo, 'ndk', '--platform', '24', '-o', rustLibs.path]
  abis.each { command += ['-t', it] }
  // Erevos+ (the default) has Matrix, XMPP and chats with other Nostr apps; the plain Erevos
  // (EREVOS_EDITION=erevos) and Erevos Lite (EREVOS_EDITION=lite, docs/editions.md) are built without them.
  def edition = System.getenv('EREVOS_EDITION') ?: 'plus'
  def plain = edition != 'plus'
  inputs.property('edition', edition)
  command += ['build', '--release', '-p', 'erevos-ffi', '--features', plain ? 'android,tor,speech' : 'android,tor,networks,speech']
  commandLine command

  doFirst {
    def ready = false
    try {
      def check = [cargo, 'ndk', '--version'].execute()
      check.waitFor()
      ready = check.exitValue() == 0
    } catch (IOException ignored) {
      // No cargo at all.
    }
    if (!ready) {
      throw new GradleException('The Erevos core needs Rust for Android to build: rustup, its Android targets and cargo-ndk. See app/modules/erevos-core/README.md.')
    }
    environment 'ANDROID_NDK_HOME', android.ndkDirectory.path
    // Paths of this computer are left out of the core (panic messages, and C that build scripts
    // compile), so the same commit builds the same library anywhere: docs/reproducible-builds.md.
    def maps = [(cargoHome): '/cargo', (repoRoot.canonicalPath): '/erevos', (android.ndkDirectory.path): '/ndk']
    environment 'CARGO_ENCODED_RUSTFLAGS', maps.collect { from, to -> "--remap-path-prefix=${from}=${to}" }.join('\u001f')
    environment 'CFLAGS', ([System.getenv('CFLAGS') ?: ''] + maps.collect { from, to -> "-ffile-prefix-map=${from}=${to}" }).join(' ').trim()
    // Build scripts run on this computer. A ~/.cargo/config that names a linker which is not
    // installed would stop them, so they use the system's own unless one is set here.
    if (!System.getenv('CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER')) {
      environment 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER', 'cc'
    }
  }
}

def buildTransports = abis.findAll { goAbis[it] }.collect { abi ->
  tasks.register("buildTransports-${abi}", Exec) {
    description = "Builds lyrebird (transports/go.mod) for ${abi}, as liblyrebird.so."
    def module = new File(repoRoot, 'transports')
    def program = new File(ptLibs, "${abi}/liblyrebird.so")
    workingDir module
    inputs.files(new File(module, 'go.mod'), new File(module, 'go.sum'))
    outputs.file(program)
    commandLine go, 'build', '-trimpath', '-buildvcs=false',
      // anet, which Snowflake's WebRTC uses to list the phone's networks, reaches into Go's own
      // net package, as Tor's builds of it allow.
      "-ldflags=-s -w -buildid= -checklinkname=0 -X main.lyrebirdVersion=${lyrebirdVersion}",
      '-o', program.path, lyrebird

    doFirst {
      def ready = false
      try {
        def check = [go, 'version'].execute()
        check.waitFor()
        ready = check.exitValue() == 0
      } catch (IOException ignored) {
        // No Go at all.
      }
      if (!ready) {
        throw new GradleException('Tor bridges need Go to build lyrebird (transports/go.mod). See app/modules/erevos-core/README.md.')
      }
      // The NDK's compiler for API 24, as the core is built for (cargo ndk --platform 24).
      def os = System.getProperty('os.name').toLowerCase()
      def windows = os.contains('windows')
      def hostTag = os.contains('mac') ? 'darwin-x86_64' : windows ? 'windows-x86_64' : 'linux-x86_64'
      def clang = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/${hostTag}/bin/${goAbis[abi].clang}24-clang${windows ? '.cmd' : ''}")
      if (!clang.exists()) {
        throw new GradleException("The NDK's compiler for ${abi} is not at ${clang}, which lyrebird is built with.")
      }
      program.parentFile.mkdirs()
      environment 'GOOS', 'android'
      environment 'GOARCH', goAbis[abi].arch
      if (abi == 'armeabi-v7a') environment 'GOARM', '7'
      environment 'CGO_ENABLED', '1'
      environment 'CC', clang.path
      environment 'GOFLAGS', '-mod=readonly'
    }
  }
}

tasks.named('preBuild') {
  dependsOn buildRustCore
  dependsOn buildTransports
}
